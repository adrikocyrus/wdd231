<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Browse the directory of local businesses that are members of the Kampala Chamber of Commerce."
    >
    <meta name="author" content="Adriko Cyrus">

    <title>Kampala Chamber of Commerce | Directory</title>

    <!-- Favicon -->
    <link rel="icon" href="images/favicon.ico" type="image/x-icon">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Poppins:wght@600;700&display=swap"
        rel="stylesheet"
    >

    <!-- Open Graph Meta Tags -->
    <meta
        property="og:title"
        content="Kampala Chamber of Commerce — Business Directory"
    >
    <meta
        property="og:description"
        content="Discover local businesses that are members of the Kampala Chamber of Commerce."
    >
    <meta
        property="og:image"
        content="https://adrikocyrus.github.io/wdd231/chamber/images/logo.svg"
    >
    <meta
        property="og:url"
        content="https://adrikocyrus.github.io/wdd231/chamber/directory.html"
    >
    <meta property="og:type" content="website">

    <!-- CSS -->
    <link rel="stylesheet" href="styles/normalize.css">
    <link rel="stylesheet" href="styles/small.css">
    <link rel="stylesheet" href="styles/larger.css">

    <!-- JavaScript -->
    <script src="scripts/main.js" defer></script>
    <script src="scripts/directory.js" defer></script>
</head>

<body>

    <header>
        <div class="logo">
            <img
                src="images/logo.svg"
                alt="Kampala Chamber of Commerce logo"
                width="60"
                height="60"
            >
            <span>Kampala Chamber</span>
        </div>

        <button
            id="menuBtn"
            type="button"
            aria-label="Toggle navigation menu"
            aria-expanded="false"
            aria-controls="primaryNav"
        >
            ☰
        </button>

        <nav id="primaryNav" aria-label="Main navigation">
            <ul>
                <li>
                    <a href="index.html">Home</a>
                </li>
                <li>
                    <a href="directory.html" class="active" aria-current="page">Directory</a>
                </li>
                <li>
                    <a href="join.html">Join</a>
                </li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Member Directory</h1>

        <div
            class="view-toggle"
            role="group"
            aria-label="Directory display options"
        >
            <button
                id="gridView"
                type="button"
                class="active"
                aria-label="Display members in grid view"
                aria-pressed="true"
            >
                ▦ Grid
            </button>

            <button
                id="listView"
                type="button"
                aria-label="Display members in list view"
                aria-pressed="false"
            >
                ☰ List
            </button>
        </div>

        <div
            id="members"
            class="grid"
            aria-live="polite"
        ></div>
    </main>

    <footer>
        <div class="contact-info">
            <p>
                <strong>Kampala Chamber of Commerce</strong>
            </p>

            <p>
                Plot 10, Kampala Boulevard, Kampala, Uganda
            </p>

            <p>
                <a href="mailto:info@kampalachamber.org">
                    info@kampalachamber.org
                </a>
                |
                <a href="tel:+256414000000">
                    +256 414 000 000
                </a>
            </p>
        </div>

        <div class="dev-info">
            <p>
                &copy; <span id="year"></span>
                Adriko Cyrus | WDD 231
            </p>

            <p>
                Last Modified:
                <span id="lastModified"></span>
            </p>
        </div>
    </footer>

</body>
</html>

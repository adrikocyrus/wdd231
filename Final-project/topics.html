<main id="content" class="container">
  <h1>Learning topics</h1>
  <p>Search or filter the topics, open a topic for more detail, and save the ones you want to revisit.</p>
  <form class="filters" role="search" onsubmit="return false">
    <div class="field">
      <label for="search">Search</label>
      <input type="search" id="search" placeholder="For example: oil">
    </div>
    <div class="field">
      <label for="system-filter">Vehicle system</label>
      <select id="system-filter"><option value="all">All systems</option></select>
    </div>
    <div class="field">
      <label for="level-filter">Level</label>
      <select id="level-filter">
        <option value="all">All levels</option>
        <option>Beginner</option>
        <option>Intermediate</option>
        <option>Advanced</option>
      </select>
    </div>
  </form>
  <p id="result-count" class="count" aria-live="polite"></p>
  <div id="topic-list" class="card-grid"></div>
</main>

<dialog id="topic-dialog" aria-labelledby="dialog-title">
  <button type="button" class="dialog-close" aria-label="Close dialog">&times;</button>
  <div class="dialog-body"></div>
</dialog>
